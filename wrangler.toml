name = "petpulse-ai"
main = "workers/api-gateway.ts"
compatibility_date = "2026-11-27"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "petpulse-ai-db"
database_id = "3b6764f5-a842-4856-90e3-afd29039296b"
migrations_dir = "migrations"

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
APP_NAME = "PetPulse AI"
APP_ENV = "production"
REQUIRE_INVITE_CODE = "false"
WORKERS_AI_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
WORKERS_AI_VISION_FALLBACK_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
WORKERS_AI_CHAT_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
