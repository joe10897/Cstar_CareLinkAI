<script>
  function switchRole(role) {
    const parentTab = document.getElementById('tab-parent');
    const sitterTab = document.getElementById('tab-sitter');
    const contentParent = document.getElementById('content-parent');
    const contentSitter = document.getElementById('content-sitter');
    const sitterNote = document.getElementById('sitter-note');

    if (role === 'parent') {
      // Tab styling
      parentTab.className = "flex-1 py-2.5 px-3 rounded-xl transition-all duration-200 flex flex-col items-center justify-center bg-surface-card shadow-sm text-primary";
      parentTab.setAttribute('aria-selected', 'true');
      sitterTab.className = "flex-1 py-2.5 px-3 rounded-xl transition-all duration-200 flex flex-col items-center justify-center text-ink-muted";
      sitterTab.setAttribute('aria-selected', 'false');

      // Content toggles
      contentParent.classList.remove('hidden');
      contentSitter.classList.add('hidden');

      // Update footnote emphasis
      sitterNote.innerHTML = `
        <span class="material-symbols-outlined text-primary text-sm mt-0.5 shrink-0">info</span>
        <p class="font-body-sm text-[11px] text-ink-secondary leading-snug">
          <strong class="text-ink-primary font-medium">首次登入保姆端？</strong>完成身分證實名認證、良民證上傳與特約獸醫皮下輸液/日常衛教培訓考核即可開通接案排程。
        </p>
      `;
    } else {
      // Tab styling
      sitterTab.className = "flex-1 py-2.5 px-3 rounded-xl transition-all duration-200 flex flex-col items-center justify-center bg-surface-card shadow-sm text-primary";
      sitterTab.setAttribute('aria-selected', 'true');
      parentTab.className = "flex-1 py-2.5 px-3 rounded-xl transition-all duration-200 flex flex-col items-center justify-center text-ink-muted";
      parentTab.setAttribute('aria-selected', 'false');

      // Content toggles
      contentSitter.classList.remove('hidden');
      contentParent.classList.add('hidden');

      // Update footnote emphasis for active sitter portal
      sitterNote.innerHTML = `
        <span class="material-symbols-outlined text-secondary text-sm mt-0.5 shrink-0">task_alt</span>
        <p class="font-body-sm text-[11px] text-ink-secondary leading-snug">
          <strong class="text-secondary font-medium">保姆認證專區：</strong>已通過培訓的保姆請使用登錄之 LINE 帳號授權，系統將即刻帶出近期待執勤排班與家長照護指引。
        </p>
      `;
    }
  }
